<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="多平台 Token 余量面板：添加账号后实时查看 DeepSeek、Kimi、硅基流动、OpenRouter、MiniMax、基元律动、WorkBuddy 与 Qoder 的余额与额度。"
    />
    <meta name="theme-color" content="#0a0b0e" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("token-panel:theme:v1");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      html { background: #0a0b0e; }
      html[data-theme="light"] { background: #f5f6f8; }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0b0e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%238b9cf9' stroke-width='2.5' stroke-linecap='round' stroke-dasharray='40 14' transform='rotate(-40 16 16)'/%3E%3C/svg%3E"
    />
    <title>多平台 Token 余量面板</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
